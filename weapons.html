<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зброя — CS2 Teams Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">CS2 <span>Teams</span> Hub</div>
    <a href="index.html" class="back-btn">← На головну</a>
  </header>

  <div class="weapons-hero">
    <h1>Зброя <em>CS2</em></h1>
    <p>Натисни на зброю, щоб почути звук вистрілу</p>
  </div>

  <main class="weapons-main">
    <div class="weapons-grid">
      <button class="weapon-btn" data-weapon="ak47">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">AK-47</span>
        <span class="weapon-tag">Rifle</span>
      </button>
      <button class="weapon-btn" data-weapon="m4a4">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">M4A4</span>
        <span class="weapon-tag">Rifle</span>
      </button>
      <button class="weapon-btn" data-weapon="m4a1s">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">M4A1-S</span>
        <span class="weapon-tag">Rifle</span>
      </button>
      <button class="weapon-btn" data-weapon="awp">
        <span class="weapon-icon">🎯</span>
        <span class="weapon-name">AWP</span>
        <span class="weapon-tag">Sniper</span>
      </button>
      <button class="weapon-btn" data-weapon="ssg08">
        <span class="weapon-icon">🎯</span>
        <span class="weapon-name">SSG 08</span>
        <span class="weapon-tag">Sniper</span>
      </button>
      <button class="weapon-btn" data-weapon="deagle">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">Desert Eagle</span>
        <span class="weapon-tag">Pistol</span>
      </button>
      <button class="weapon-btn" data-weapon="glock">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">Glock-18</span>
        <span class="weapon-tag">Pistol</span>
      </button>
      <button class="weapon-btn" data-weapon="usps">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">USP-S</span>
        <span class="weapon-tag">Pistol</span>
      </button>
      <button class="weapon-btn" data-weapon="p90">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">P90</span>
        <span class="weapon-tag">SMG</span>
      </button>
      <button class="weapon-btn" data-weapon="mac10">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">MAC-10</span>
        <span class="weapon-tag">SMG</span>
      </button>
      <button class="weapon-btn" data-weapon="galil">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">Galil AR</span>
        <span class="weapon-tag">Rifle</span>
      </button>
      <button class="weapon-btn" data-weapon="famas">
        <span class="weapon-icon">🔫</span>
        <span class="weapon-name">FAMAS</span>
        <span class="weapon-tag">Rifle</span>
      </button>
    </div>
  </main>

  <footer>© 2026 CS2 Teams Hub · Усі дані вказані в ознайомчих цілях</footer>

  <script src="weapons.js"></script>
</body>
</html>
