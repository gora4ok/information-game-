<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Teams Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">CS2 <span>Teams</span> Hub</div>
    <a href="teams.html" class="info-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Інфо про команди
    </a>
  </header>
  <section class="weapons-promo">
  <a href="weapons.html" class="weapons-promo-card">
    <div class="weapons-promo-icon">🔫</div>
    <div class="weapons-promo-text">
      <div class="weapons-promo-title">Зброя <span>CS2</span></div>
      <div class="weapons-promo-desc">Переглянь всі види зброї та послухай звуки вистрілів</div>
    </div>
    <div class="weapons-promo-arrow">→</div>
  </a>
</section>

  <div class="hero">
    <h1>Топ <em>CS2</em><br>Команди</h1>
    <p>Обери команду щоб дізнатись більше</p>
  </div>

  <main>
    <div class="team-list-wrap">
      <div class="panel-label">Рейтинг команд</div>

      <button class="team-btn" onclick="selectTeam('navi', this)">
        <span class="team-rank">#1</span>
        <span class="team-flag">🇺🇦</span>
        <span class="team-btn-name">Natus Vincere</span>
        <span class="team-tag">NaVi</span>
      </button>

      <button class="team-btn" onclick="selectTeam('faze', this)">
        <span class="team-rank">#2</span>
        <span class="team-flag">🌍</span>
        <span class="team-btn-name">FaZe Clan</span>
        <span class="team-tag">FaZe</span>
      </button>

      <button class="team-btn" onclick="selectTeam('g2', this)">
        <span class="team-rank">#3</span>
        <span class="team-flag">🇩🇪</span>
        <span class="team-btn-name">G2 Esports</span>
        <span class="team-tag">G2</span>
      </button>

      <button class="team-btn" onclick="selectTeam('vitality', this)">
        <span class="team-rank">#4</span>
        <span class="team-flag">🇫🇷</span>
        <span class="team-btn-name">Team Vitality</span>
        <span class="team-tag">VIT</span>
      </button>

      <button class="team-btn" onclick="selectTeam('mouz', this)">
        <span class="team-rank">#5</span>
        <span class="team-flag">🇩🇪</span>
        <span class="team-btn-name">MOUZ</span>
        <span class="team-tag">MOUZ</span>
      </button>
    </div>

    <div class="detail-panel" id="detail-panel">
      <div class="detail-placeholder">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <p>Обери команду зліва</p>
      </div>
    </div>

    <section class="graph">
      
      <div style="width: 500px; margin: 50px auto;">
        <canvas id="myLocalChart"></canvas>
    </div>
     
    </section>


    
  </main>
  

  <footer>© 2026 CS2 Teams Hub · Усі дані вказані в ознайомчих цілях</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
